name: PowerShell prüfen

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PSScriptAnalyzer installieren
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force

      - name: Skripte analysieren
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          if ($results) {
              $results | Format-Table RuleName, Severity, ScriptName, Line, Message -AutoSize -Wrap | Out-String -Width 200
          }
          $errors = @($results | Where-Object Severity -eq 'Error')
          if ($errors.Count -gt 0) {
              Write-Error "$($errors.Count) Fehler gefunden"
              exit 1
          }
          Write-Host "Keine Fehler gefunden ($(@($results).Count) Hinweise)."
